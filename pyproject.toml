[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h2r"
version = "0.1.0"
description = "h2r — HTTP/2 robotics pub/sub middleware (pure Python implementation)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "h2>=4.1",
    "protobuf>=4.25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "ty>=0.0.1a8",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx[http2]>=0.27",
]
bench = [
    "psutil>=5.9",
    "pyzmq>=26",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "eclipse-zenoh>=1.0",
    "websockets>=15.0",
    "paho-mqtt>=2.1",
    "amqtt>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["h2r*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with `ruff format`
    "ISC001", # conflicts with `ruff format`
    "CPY001", # no per-file copyright headers; LICENSE covers it
    "D203",   # incompatible with D211 (picked below)
    "D213",   # incompatible with D212 (picked below)
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is pytest's mechanism
    "D",       # test names are self-documenting
    "SLF001",  # tests exercise private pure helpers directly, by design
    "PLR2004", # expected values in assertions are the point of a test, not magic numbers
]
"examples/**" = [
    "T201",   # print output is the point of a standalone example script
    "INP001", # standalone example scripts, not part of an installable package
]
"benchmarks/**" = [
    "T201",     # benchmark scripts report results via print, by design
    "S603",     # subprocess calls launch our own benchmark scripts with fixed args
    "S607",     # partial executable paths (python, uv) are fine here, not user input
    "E402",     # grpc_bench.py generates its stub modules before importing them
    "PLR0913",  # scenario/report builders take many independent named measurements
    "ASYNC110", # h2r_bench.py's short listen-port poll has no event to wait on instead
    "ASYNC240", # mqtt_bench.py polls a small ready-file from an async publish loop shared
    # with the amqtt broker's event loop, same reasoning as ASYNC110 above
    "UP017",    # datetime.UTC is 3.11+; the bench-ros2 image's system Python is 3.10
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/h2r"]
relative_files = true
